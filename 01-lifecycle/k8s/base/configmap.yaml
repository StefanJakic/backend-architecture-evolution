apiVersion: v1
kind: ConfigMap
metadata:
  name: order-lifecycle-config
data:
  ORDER_EVENTS_TOPIC: order.lifecycle.v1
  ORDER_STATUS_CACHE_ENABLED: "true"
  ORDER_STATUS_CACHE_TTL: 5m
  REDIS_CONNECT_TIMEOUT: 500ms
  REDIS_READ_TIMEOUT: 500ms
  OUTBOX_RELAY_ENABLED: "true"
  OUTBOX_RELAY_FIXED_DELAY_MS: "500"
  OUTBOX_RELAY_BATCH_SIZE: "100"
  OUTBOX_RELAY_LEASE_TIMEOUT_MS: "30000"
  OUTBOX_RELAY_PUBLISH_TIMEOUT_SECONDS: "10"
  TRACING_SAMPLING_PROBABILITY: "0.1"
  OTEL_EXPORT_ENABLED: "true"
  OTEL_TRACES_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  OTEL_METRICS_EXPORT_ENABLED: "false"
