spring:
  application:
    name: order-lifecycle
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifecycle}
    username: ${DB_USERNAME:lifecycle}
    password: ${DB_PASSWORD:lifecycle}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash

order:
  events:
    topic: ${ORDER_EVENTS_TOPIC:order.lifecycle.v1}

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:500}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
    lease-timeout-ms: ${OUTBOX_RELAY_LEASE_TIMEOUT_MS:30000}
    publish-timeout-seconds: ${OUTBOX_RELAY_PUBLISH_TIMEOUT_SECONDS:10}
