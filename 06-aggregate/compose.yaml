services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aggregate
      POSTGRES_USER: aggregate
      POSTGRES_PASSWORD: aggregate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregate -d aggregate"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aggregate-postgres:/var/lib/postgresql/data

volumes:
  aggregate-postgres:
